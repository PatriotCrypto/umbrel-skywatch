version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: skywatch-radar_web_1
      APP_PORT: 3928

  web:
    image: ghcr.io/patriotcrypto/skywatch-radar:0.1.2
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 10s
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      DATA_DIR: /data
      PORT: 3928
