name: Publish image

# Builds the app for both Umbrel CPU types (x86 and ARM) and pushes it to
# GitHub Container Registry whenever a version tag like v0.1.0 is pushed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out the version
        id: v
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/patriotcrypto/skywatch-radar:${{ steps.v.outputs.version }}
            ghcr.io/patriotcrypto/skywatch-radar:latest
      - name: Show the digest to pin in docker-compose.yml
        run: echo "ghcr.io/patriotcrypto/skywatch-radar:${{ steps.v.outputs.version }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
